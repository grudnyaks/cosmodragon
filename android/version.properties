# Версия APK-оболочки. Увеличивайте apkVersion, только когда меняется Java-код или манифест:
# тогда приложение предложит скачать новый APK.
# Изменения игры (папка web/) приходят по воздуху без переустановки.
apkVersion=3
# Минимальная версия APK, с которой совместима текущая игра (увеличить, если игра начала
# использовать новые функции оболочки).
minApk=1
